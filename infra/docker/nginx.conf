# Same-origin front: static SPA + reverse proxy to the API (incl. SSE and the terminal WebSocket).
# Access logs use $uri (no query string) so one-time terminal tickets and search terms never land in logs.
log_format sb '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent" rid=$upstream_http_x_request_id';
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log /dev/stdout sb;
  client_max_body_size 30m;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location ~ ^/api/v1/admin/native-claude/terminal$ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location ~ ^/api/v1/runs/[0-9a-f-]+/events$ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /health/ { proxy_pass http://api:3000; access_log off; }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-store"; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy same-origin always; add_header X-Frame-Options DENY always; }
}
